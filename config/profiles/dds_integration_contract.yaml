{
  "schema_version": 1,
  "description": "Ground-station and cross-package ROS 2 data contract. JSON syntax is valid YAML 1.2.",
  "topics": [
    {
      "name": "/mission/start",
      "type": "std_msgs/msg/UInt32",
      "semantics": "One-shot task event: 0 invalid, 1 contest task 1, 2 contest task 2, 3 VERTICAL_TEST; accepted only with the immediately preceding fresh context.",
      "endpoints": [
        {
          "package": "mission_bridge",
          "role": "publisher",
          "path": "src/communication/Serial/Serial_ROS2/mission_bridge/src/mission_bridge_node.cpp",
          "evidence": [
            "create_publisher<std_msgs::msg::UInt32>(",
            "\"/mission/start\", start_event_qos"
          ]
        },
        {
          "package": "offboard_cpp",
          "role": "subscriber",
          "path": "src/offboard_cpp/src/flight_sequence_node.cpp",
          "evidence": [
            "create_subscription<std_msgs::msg::UInt32>(",
            "offboard_topics::kMissionStart, qos",
            "rclcpp::Subscription<std_msgs::msg::UInt32>::SharedPtr start_sub_"
          ]
        }
      ]
    },
    {
      "name": "/mission/start/context",
      "type": "std_msgs/msg/UInt64",
      "semantics": "Volatile context published immediately before START: mission_id[15:0], session_id[23:16], seq[31:24], bridge source_epoch[63:32].",
      "endpoints": [
        {
          "package": "mission_bridge",
          "role": "publisher",
          "path": "src/communication/Serial/Serial_ROS2/mission_bridge/src/mission_bridge_node.cpp",
          "evidence": [
            "create_publisher<std_msgs::msg::UInt64>(",
            "\"/mission/start/context\", start_event_qos",
            "start_context_pub_->publish(context_msg)",
            "start_pub_->publish(start_msg)"
          ]
        },
        {
          "package": "offboard_cpp",
          "role": "subscriber",
          "path": "src/offboard_cpp/src/flight_sequence_node.cpp",
          "evidence": [
            "create_subscription<std_msgs::msg::UInt64>(",
            "offboard_topics::kMissionStartContext, qos",
            "rclcpp::Subscription<std_msgs::msg::UInt64>::SharedPtr start_context_sub_"
          ]
        }
      ]
    },
    {
      "name": "/uav/mission_state",
      "type": "std_msgs/msg/String",
      "semantics": "Current UAV task-state-machine state name; published on state transitions.",
      "endpoints": [
        {
          "package": "offboard_cpp",
          "role": "publisher",
          "path": "src/offboard_cpp/src/flight_sequence_node.cpp",
          "evidence": [
            "create_publisher<std_msgs::msg::String>(offboard_topics::kUavMissionState"
          ]
        }
      ]
    },
    {
      "name": "/car/link_state",
      "type": "std_msgs/msg/String",
      "semantics": "Compact car-link/session/heartbeat diagnostics snapshot.",
      "endpoints": [
        {
          "package": "mission_bridge",
          "role": "publisher",
          "path": "src/communication/Serial/Serial_ROS2/mission_bridge/src/mission_bridge_node.cpp",
          "evidence": [
            "create_publisher<std_msgs::msg::String>(\"/car/link_state\""
          ]
        }
      ]
    },
    {
      "name": "/mission/fault",
      "type": "std_msgs/msg/String",
      "semantics": "Event-oriented integration fault text, including serial loss, heartbeat timeout and mission abort.",
      "endpoints": [
        {
          "package": "mission_bridge",
          "role": "publisher",
          "path": "src/communication/Serial/Serial_ROS2/mission_bridge/src/mission_bridge_node.cpp",
          "evidence": [
            "create_publisher<std_msgs::msg::String>(\"/mission/fault\""
          ]
        }
      ]
    }
  ],
  "vision_default": {
    "config": "src/vision_to_dds/config/vision_to_dds.yaml",
    "required_text": "enable_vision_dds: false"
  }
}
