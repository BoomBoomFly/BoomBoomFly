name: Wave 3B Offline Integration Gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-static:
    runs-on: ubuntu-20.04
    timeout-minutes: 10
    env: &governance_env
      WAVE3B_JOB_ID: governance-static
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
    steps: &offline_gate_steps
      - name: Checkout exact requested revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Record Bubblewrap executable identity
        shell: bash
        run: |
          set -euo pipefail
          command -v bwrap
          /usr/bin/bwrap --version
      - name: Run fail-closed offline gate
        shell: bash
        run: >-
          python3 Scripts/ci/run_offline_gate.py
          --job "$WAVE3B_JOB_ID"
          --artifact-root "$RUNNER_TEMP/wave3b/$WAVE3B_JOB_ID"
      - name: Upload success summary for 14 days
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave3b-${{ env.WAVE3B_JOB_ID }}-summary
          path: ${{ runner.temp }}/wave3b/${{ env.WAVE3B_JOB_ID }}/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics for 30 days
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave3b-${{ env.WAVE3B_JOB_ID }}-diagnostics
          path: ${{ runner.temp }}/wave3b/${{ env.WAVE3B_JOB_ID }}/diagnostics.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation ledger for 90 days
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave3b-${{ env.WAVE3B_JOB_ID }}-ledger
          path: ${{ runner.temp }}/wave3b/${{ env.WAVE3B_JOB_ID }}/ledger.json
          if-no-files-found: error
          retention-days: 90

  python-unit:
    runs-on: ubuntu-20.04
    timeout-minutes: 15
    env:
      WAVE3B_JOB_ID: python-unit
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
    steps: *offline_gate_steps

  dds-boundary:
    needs: [governance-static]
    if: ${{ always() }}
    runs-on: ubuntu-20.04
    timeout-minutes: 10
    env:
      WAVE3B_JOB_ID: dds-boundary
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
    steps: *offline_gate_steps

  evidence-integrity:
    needs: [governance-static]
    if: ${{ always() }}
    runs-on: ubuntu-20.04
    timeout-minutes: 15
    env:
      WAVE3B_JOB_ID: evidence-integrity
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
    steps: *offline_gate_steps

  sitl-spec-offline:
    needs: [python-unit]
    if: ${{ always() }}
    runs-on: ubuntu-20.04
    timeout-minutes: 15
    env:
      WAVE3B_JOB_ID: sitl-spec-offline
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
      WAVE3B_EVIDENCE_CLASS: OFFLINE_SYNTHETIC
    steps: *offline_gate_steps

  supply-chain-static:
    needs: [governance-static]
    if: ${{ always() }}
    runs-on: ubuntu-20.04
    timeout-minutes: 15
    env:
      WAVE3B_JOB_ID: supply-chain-static
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
    steps: *offline_gate_steps

  dds-build-test:
    needs: [dds-boundary, evidence-integrity, supply-chain-static]
    if: ${{ always() }}
    runs-on: ubuntu-20.04
    timeout-minutes: 45
    env:
      WAVE3B_JOB_ID: dds-build-test
      WAVE3B_NEEDS_JSON: ${{ toJSON(needs) }}
    steps: *offline_gate_steps
